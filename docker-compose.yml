services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:4000
    container_name: smartlearn-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    restart: unless-stopped
    networks:
      - smartlearn-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartlearn-backend
    depends_on:
      mongo:
        condition: service_healthy
      mysql:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
      MONGODB_URI: mongodb://mongo:27017/learning
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-smartlearn}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-smartlearn_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smartlearn}
      ML_SERVICE_URL: http://ml-service:8001
    ports:
      - "4000:4000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:4000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - smartlearn-net

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: smartlearn-ml-service
    environment:
      MODEL_PATH: /app/models/recommender.pkl
      MONGODB_URI: mongodb://mongo:27017/learning
      MONGO_DB: learning
    volumes:
      - ./ml-service/models:/app/models
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')\""]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - smartlearn-net

  mysql:
    image: mysql:8.4
    container_name: smartlearn-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smartlearn}
      MYSQL_USER: ${MYSQL_USER:-smartlearn}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-smartlearn_password}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/mysql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/mysql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - smartlearn-net

  mongo:
    image: mongo:7
    container_name: smartlearn-mongo
    command: ["--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand({ ping: 1 }).ok\" | grep 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - smartlearn-net

networks:
  smartlearn-net:
    driver: bridge

volumes:
  mysql-data:
  mongo-data:
