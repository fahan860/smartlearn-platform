# Configuration Spark pour Learning Platform
# Configuration optimisée pour environnement local

# Spark Core
spark.app.name=LearningPlatform-ETL
spark.master=local[*]

# Mémoire
spark.driver.memory=2g
spark.executor.memory=2g
spark.python.worker.memory=512m

# Performance
spark.sql.shuffle.partitions=10
spark.default.parallelism=4
spark.sql.adaptive.enabled=true
spark.sql.adaptive.coalescePartitions.enabled=true

# CSV Settings
spark.sql.csv.encoding=UTF-8
spark.sql.csv.inferSchema=true
spark.sql.csv.header=true

# Logs
spark.eventLog.enabled=false
spark.ui.showConsoleProgress=true
spark.log.level=WARN

# Compression
spark.sql.files.ignoreCorruptFiles=true
spark.sql.files.ignoreMissingFiles=true
